seed: 17
device: auto
evaluation:
  minority_bottom_quantile: 0.25
output_dir: outputs/ave/official
training_conditions: [reference, ci_only, proposed_ci_mi]
dataset:
  name: ave
  adapter: ave
  require_source_disjoint: false
  factory: ave_mm.dataset:build_datasets
  split_protocol: official
  kwargs:
    manifest_path: data/raw/AVE/ave/ave_manifest.csv
    root: .
    num_frames: 8
    image_size: 224
    sample_rate: 16000
    audio_samples: 160000
    temporal_window_policy: full_clip
    min_audio_coverage: 0.5
test_dataset:
  name: ave
  adapter: ave
  require_source_disjoint: false
  factory: ave_mm.dataset:build_test_dataset
  split_protocol: official
  kwargs:
    manifest_path: data/raw/AVE/ave/ave_manifest.csv
    root: .
    num_frames: 8
    image_size: 224
    sample_rate: 16000
    audio_samples: 160000
    temporal_window_policy: full_clip
    min_audio_coverage: 0.5
model:
  factory: ave_mm.models:build_model
  kwargs:
    dim: 128
    heads: 4
    encoder_1:
      name: panns_cnn14
      kwargs:
        input_sample_rate: 16000
        pretrained: true
        freeze: true
    encoder_2:
      name: resnet18
      kwargs:
        pretrained: true
        freeze: true
    freeze_encoders: true
contribution:
  estimator: utopia_mutual_information
  fcd_factory: multimodal.contribution.fcd:InfoNCEFCD
  target_estimator: risk_based
  target_granularity: global
  epsilon: 1.0e-08
  fcd_kwargs:
    queue_size: 1024
    exclude_same_source_negatives: true
  bootstrap_replicates: 200
  max_bootstrap_std: 0.15
  target_min_support: 20
  min_group_support_floor: 20
  max_groups_per_class: 3
training:
  batch_size: 4
  num_workers: 0
  epochs: 30
  early_stopping_patience: 5
  learning_rate: 0.0003
  weight_decay: 0.0001
  modality_dropout: 0.2
  contribution_estimation_fraction: 0.2
  optimization_mode: fixed_weight
  ci_objective: class_balanced
  lambda_mi_grid:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  grad_clip: 1.0

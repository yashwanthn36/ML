[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-research-pipeline"
version = "0.1.0"
description = "Reproducible contribution-aware paired audio-video research pipeline"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "torchaudio>=2.0",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "imageio-ffmpeg>=0.6",
  "panns-inference>=0.1.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
